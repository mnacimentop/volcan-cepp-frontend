# SonarQube Project Configuration
# https://docs.sonarqube.org/latest/analyzing-source-code/scanners/sonarscanner/

# ── Project identification ───────────────────────────────────────────────────
sonar.projectKey=edenor-sdr-frontend
sonar.projectName=edenor-sdr-frontend
sonar.projectVersion=0.1.0
sonar.host.url=https://sonarqube.internal.pormel.tech/

# ── Source & language ────────────────────────────────────────────────────────
sonar.sources=src
sonar.sourceEncoding=UTF-8

# ── Exclusions ───────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/public/**,\
  **/dist/**,\
  **/*.d.ts,\
  **/index.ts,\
  **/*.types.ts,\
  **/*.interface.ts,\
  **/common/interfaces/**,\
  **/common/models/**,\
  **/mocks/**,\
  **/(mocks)/**,\
  **/(models)/**,\
  **/(test-utils)/**,\
  **/*.mock.ts,\
  **/*.mock.tsx,\
  **/*.model.ts,\
  **/test/**

# ── Test configuration ───────────────────────────────────────────────────────
sonar.tests=src
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Coverage ─────────────────────────────────────────────────────────────────
sonar.coverage.exclusions=\
  **/*.d.ts,\
  **/index.ts,\
  **/*.types.ts,\
  **/*.interface.ts,\
  **/common/interfaces/**,\
  **/common/models/**,\
  **/mocks/**,\
  **/(mocks)/**,\
  **/(models)/**,\
  **/(test-utils)/**,\
  **/*.mock.ts,\
  **/*.mock.tsx,\
  **/*.model.ts,\
  **/test/**

# ── TypeScript ───────────────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.json

# ── Quality gate ───────────────────────────────────────────────────────────────
sonar.qualitygate.wait=true
